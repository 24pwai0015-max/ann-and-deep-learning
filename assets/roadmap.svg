<?xml version="1.0" encoding="UTF-8"?>
<svg width="1000" height="160" viewBox="0 0 1000 160"
     xmlns="http://www.w3.org/2000/svg"
     role="img" aria-labelledby="roadmapTitle">
  <title id="roadmapTitle">ANN Course Roadmap – 4 weeks, all upcoming</title>

  <style>
    @media (prefers-reduced-motion: reduce) {
      * { animation-duration: 0s !important; animation-iteration-count: 1 !important; }
    }
  </style>

  <rect width="100%" height="100%" fill="transparent"/>

  <!-- Connecting line -->
  <line x1="130" y1="80" x2="870" y2="80"
        stroke="#9BA5B4" stroke-width="1.5" stroke-dasharray="6,6" opacity="0.25"/>

  <!-- ══ WEEK 1 — Perceptron · CURRENT (pulsing) ══ -->
  <g transform="translate(130,80)">
    <circle r="18" fill="none" stroke="#7C3AED" stroke-width="1" opacity="0.25">
      <animate attributeName="r"       values="18;24;18" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.25;0.08;0.25" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle r="10" fill="#7C3AED" opacity="0.85">
      <animate attributeName="opacity" values="0.85;0.5;0.85" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle r="3" fill="#0A0E14"/>
    <text y="-30" text-anchor="middle"
          font-family="ui-monospace,'SF Mono',Consolas,'Segoe UI',sans-serif"
          font-size="11" font-weight="700" fill="#7C3AED">WEEK 1</text>
    <text y="30" text-anchor="middle"
          font-family="ui-monospace,'SF Mono',Consolas,'Segoe UI',sans-serif"
          font-size="9" fill="#9BA5B4">Perceptron</text>
    <text y="44" text-anchor="middle"
          font-family="ui-monospace,'SF Mono',Consolas,'Segoe UI',sans-serif"
          font-size="8" fill="#00D9FF">● up next</text>
  </g>

  <!-- ══ WEEK 2 — MLP · FUTURE ══ -->
  <g transform="translate(377,80)">
    <circle r="10" fill="none" stroke="#9BA5B4" stroke-width="1.5" opacity="0.35"/>
    <text y="-30" text-anchor="middle"
          font-family="ui-monospace,'SF Mono',Consolas,'Segoe UI',sans-serif"
          font-size="11" fill="#9BA5B4" opacity="0.5">WEEK 2</text>
    <text y="30" text-anchor="middle"
          font-family="ui-monospace,'SF Mono',Consolas,'Segoe UI',sans-serif"
          font-size="9" fill="#9BA5B4" opacity="0.4">MLP &amp; Forward</text>
  </g>

  <!-- ══ WEEK 3 — Loss & Gradient · FUTURE ══ -->
  <g transform="translate(623,80)">
    <circle r="10" fill="none" stroke="#9BA5B4" stroke-width="1.5" opacity="0.35"/>
    <text y="-30" text-anchor="middle"
          font-family="ui-monospace,'SF Mono',Consolas,'Segoe UI',sans-serif"
          font-size="11" fill="#9BA5B4" opacity="0.5">WEEK 3</text>
    <text y="30" text-anchor="middle"
          font-family="ui-monospace,'SF Mono',Consolas,'Segoe UI',sans-serif"
          font-size="9" fill="#9BA5B4" opacity="0.4">Loss &amp; Gradient</text>
  </g>

  <!-- ══ WEEK 4 — Backprop · FUTURE ══ -->
  <g transform="translate(870,80)">
    <circle r="10" fill="none" stroke="#9BA5B4" stroke-width="1.5" opacity="0.35"/>
    <text y="-30" text-anchor="middle"
          font-family="ui-monospace,'SF Mono',Consolas,'Segoe UI',sans-serif"
          font-size="11" fill="#9BA5B4" opacity="0.5">WEEK 4</text>
    <text y="30" text-anchor="middle"
          font-family="ui-monospace,'SF Mono',Consolas,'Segoe UI',sans-serif"
          font-size="9" fill="#9BA5B4" opacity="0.4">Backpropagation</text>
  </g>
</svg>
